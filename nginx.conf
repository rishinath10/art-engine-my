server {
    listen      80;
    listen      [::]:80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip            on;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml application/xhtml+xml;

    # Asset filenames carry a content hash, so they can be cached forever.
    location ^~ /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files  $uri =404;
    }

    # The share card sits at a stable URL that unfurlers re-fetch, so unlike
    # the hashed assets above it has to be allowed to change.
    location = /og-image.png {
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /robots.txt  { expires 1d; add_header Cache-Control "public, max-age=86400"; }
    location = /sitemap.xml { expires 1d; add_header Cache-Control "public, max-age=86400"; }

    # Every page is prerendered as <route>/index.html, so a real file or
    # directory is served and anything else is genuinely missing. nginx
    # redirects /about to /about/, which is the form the canonical tags and
    # the sitemap already use, so no canonical points at a redirect.
    #
    # Note there is no SPA fallback on purpose: serving index.html for an
    # unknown path would answer 200 and invite Google to index it.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files  $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
